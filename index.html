<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2ea8f0">
<title>Kids Learn — العب وتعلم</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body { font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif; }
button { font-family: inherit; cursor: pointer; }
img { -webkit-user-drag: none; user-select: none; }

/* ======= scene (Kenney illustrated world) ======= */
.kl-root { min-height: 100vh; position: relative; overflow-x: hidden; background: #6ecdf5; }
.kl-scene {
    position: relative; min-height: 100vh; padding: 14px 16px 26px; padding-top: max(14px, env(safe-area-inset-top));
    background: url('assets/bg/grass.png') center bottom / cover no-repeat fixed, linear-gradient(180deg, #2ea8f0 0%, #6ecdf5 60%, #8ed06e 100%);
}
.kl-sun { position: fixed; top: 14px; right: 18px; width: 84px; height: 84px; z-index: 0; pointer-events: none; animation: kl-sunspin 30s linear infinite; }
@keyframes kl-sunspin { to { transform: rotate(360deg); } }
.kl-cloud { position: fixed; z-index: 0; pointer-events: none; opacity: .95; animation: kl-drift linear infinite; }
@keyframes kl-drift { from { transform: translateX(-160px); } to { transform: translateX(110vw); } }
.kl-tree { position: fixed; z-index: 0; pointer-events: none; }
.kl-bush { position: fixed; z-index: 0; pointer-events: none; }

.kl-wrap { max-width: 480px; margin: 0 auto; position: relative; z-index: 2; }
.kl-page { animation: kl-page-in .38s cubic-bezier(.2,.9,.3,1.12); }
@keyframes kl-page-in { from { opacity: 0; transform: translateY(18px) scale(.985); } }

/* ======= chunky toy UI ======= */
.kl-card { background: #fff; border-radius: 28px; border: 4px solid #e6dfff; box-shadow: 0 8px 0 rgba(60,40,120,.14); padding: 18px; }
.kl-rtl { direction: rtl; }
.kl-h1 { font-size: 30px; font-weight: 900; color: #3b2a5e; text-align: center; margin-bottom: 4px; }
.kl-note { color: #7a7194; font-weight: 700; font-size: 14.5px; text-align: center; margin: 6px 0 12px; line-height: 1.7; }
.kl-label { display: block; font-weight: 900; color: #3b2a5e; margin: 12px 0 6px; font-size: 16px; }
.kl-input { width: 100%; border: 3px solid #d9d2f0; border-radius: 18px; padding: 14px 16px; font-size: 19px; font-weight: 800; color: #3b2a5e; background: #f8f6ff; outline: none; }
.kl-input:focus { border-color: #7c5cff; background: #fff; }
.kl-cta {
    display: block; width: 100%; border: none; border-radius: 22px; margin-top: 14px;
    padding: 16px; font-size: 21px; font-weight: 900; color: #5b3b00;
    background: linear-gradient(135deg, #ffd93d, #ffb03d); box-shadow: 0 6px 0 #d98e1f;
}
.kl-cta:active { transform: translateY(4px); box-shadow: 0 2px 0 #d98e1f; }
.kl-ghost { display: block; width: 100%; border-radius: 18px; margin-top: 10px; padding: 13px; background: #f1eeff; border: 3px solid #d9d2f0; color: #5b4b8a; font-weight: 900; font-size: 16px; }
.kl-danger { background: #fff1f1; border-color: #ffc9c9; color: #c92a2a; }
.kl-warn { margin-top: 12px; background: #fff7e6; border-radius: 16px; padding: 12px 14px; font-size: 13.5px; font-weight: 700; color: #9a5b00; line-height: 1.7; }
.kl-themes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.kl-themebtn { border: 3px solid #d9d2f0; background: #f8f6ff; border-radius: 20px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.kl-themeimg { width: 62px; height: 62px; object-fit: contain; }
.kl-themebtn .tn { font-weight: 900; color: #3b2a5e; font-size: 15px; }
.kl-themebtn-on { border-color: #ffb03d; background: #fff6df; box-shadow: 0 4px 0 #ffd93d; }
.kl-kgbtn { padding: 10px 6px; }
.kl-kg { background: #f5f3ff; border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
.kl-kg-row { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; font-weight: 800; color: #2d2340; font-size: 14px; }
.kl-kgico { width: 26px; height: 26px; object-fit: contain; vertical-align: -7px; }
.kl-kg-chip { background: #ffd93d; color: #4a2c00; border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
.kl-kg-desc { font-size: 12.5px; color: #6b6480; font-weight: 700; text-align: right; padding: 2px 0 4px; }
.kl-slider { width: 100%; accent-color: #7c5cff; margin: 4px 0 10px; }
.kl-stage { width: 250px; margin: 10px auto; touch-action: none; border-radius: 28px; background: linear-gradient(160deg,#f5f3ff,#e0f2fe); padding: 14px; box-shadow: inset 0 0 0 3px rgba(124,92,255,.25); }
.kl-footer { text-align: center; color: rgba(255,255,255,.95); font-size: 12.5px; font-weight: 700; margin-top: 18px; text-shadow: 0 1px 3px rgba(0,60,20,.35); }

/* ======= top bar ======= */
.kl-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; position: relative; z-index: 3; }
.kl-stars {
    background: linear-gradient(135deg, #ffd93d, #ffb03d); color: #4a2c00;
    border-radius: 999px; padding: 7px 14px; font-size: 18px; font-weight: 900;
    box-shadow: 0 4px 0 #d98e1f; display: flex; align-items: center; gap: 6px;
}
.kl-stars img { width: 24px; height: 24px; }
.kl-stars-pop { animation: kl-starspop .45s ease; }
@keyframes kl-starspop { 40% { transform: scale(1.25) rotate(-4deg); } }
.kl-iconbtn {
    background: #fff; border: 3px solid #e6dfff; color: #5b4b8a; width: 48px; height: 48px;
    border-radius: 16px; font-size: 21px; box-shadow: 0 4px 0 rgba(60,40,120,.18);
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.kl-iconbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(60,40,120,.18); }
.kl-gtitle { font-size: 21px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,80,140,.35); display: flex; align-items: center; gap: 7px; }
.kl-gtitle img { width: 30px; height: 30px; object-fit: contain; filter: drop-shadow(0 2px 0 rgba(0,80,140,.35)); }

/* ======= costume: animal + photo face ======= */
.kl-costume { position: relative; width: 100%; }
.kl-costume .kl-animal { width: 100%; height: auto; display: block; }
.kl-face {
    position: absolute; aspect-ratio: 1; border-radius: 50%; overflow: hidden;
    transform: translate(-50%, -50%); background: #ffe9c9; box-shadow: 0 0 0 3px rgba(255,255,255,.9);
}
.kl-face img { width: 100%; height: 100%; object-fit: cover; }

/* ======= home ======= */
.kl-hero { display: flex; align-items: flex-end; gap: 10px; margin: 2px 0 14px; }
.kl-hero-art { width: 132px; flex: none; animation: kl-bob 3.2s ease-in-out infinite; filter: drop-shadow(0 8px 10px rgba(20,60,20,.25)); }
@keyframes kl-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.kl-bubble { position: relative; background: #fff; border: 3px solid #ffd93d; border-radius: 20px; padding: 12px 14px; margin-bottom: 18px; box-shadow: 0 5px 0 rgba(60,40,120,.12); }
.kl-bubble:after { content: ''; position: absolute; left: -14px; bottom: 14px; border: 8px solid transparent; border-right-color: #ffd93d; border-left: none; }
.kl-bubble .hi { font-size: 21px; font-weight: 900; color: #3b2a5e; }
.kl-bubble .sub { font-size: 14.5px; font-weight: 700; color: #7a7194; margin-top: 2px; }
.kl-spots { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.kl-spot {
    border: none; border-radius: 30px; padding: 14px 10px 13px; color: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    box-shadow: 0 8px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.4);
    transition: transform .12s ease;
}
.kl-spot:active { transform: translateY(5px) scale(.97); box-shadow: 0 2px 0 rgba(0,0,0,.18); }
.kl-spot .em { width: 58px; height: 58px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.kl-spot .em img { width: 44px; height: 44px; object-fit: contain; }
.kl-spot .tt { font-size: 18px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.18); }
.kl-spot .ss { font-size: 12.5px; font-weight: 700; opacity: .92; }
.kl-spot .lv { font-size: 11.5px; font-weight: 900; background: rgba(255,255,255,.32); border-radius: 999px; padding: 2px 10px; margin-top: 2px; }
.kl-spot:nth-child(odd) { animation: kl-sway2 5s ease-in-out infinite; }
@keyframes kl-sway2 { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1.2deg); } }

/* ======= game scenes ======= */
.kl-coach { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
.kl-coach .mini { width: 76px; flex: none; filter: drop-shadow(0 4px 6px rgba(20,60,20,.25)); }
.kl-coach .mini img { width: 100%; height: auto; display: block; }
.kl-coach .kl-bubble { flex: 1; margin-bottom: 0; }
.kl-coach .kl-bubble:after { left: -14px; top: 22px; bottom: auto; }
.kl-lvlrow { display: flex; gap: 7px; justify-content: center; margin: 2px 0 8px; }
.kl-dot { width: 13px; height: 13px; border-radius: 50%; background: rgba(255,255,255,.45); }
.kl-dot-on { background: #ffd93d; box-shadow: 0 2px 0 #d98e1f; }
.kl-wordpic { text-align: center; margin: 2px 0 4px; }
.kl-wordpic img { width: 84px; height: 84px; object-fit: contain; filter: drop-shadow(0 4px 4px rgba(20,60,20,.3)); }

/* bubble pop */
.kl-bubfield { position: relative; height: 430px; }
.kl-bub {
    position: absolute; width: 82px; height: 84px; border: none; background: url('assets/fx/bubble.png') center/contain no-repeat;
    color: #155e96; font-size: 30px; font-weight: 900; padding-bottom: 6px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 6px 8px rgba(30,90,160,.3));
    animation: kl-bubfloat 2.6s ease-in-out infinite alternate;
}
.kl-bub.hit { animation: none; transform: scale(0) rotate(30deg); transition: transform .2s ease-in; opacity: 0; }
.kl-bub.nope { animation: kl-shake .4s ease; }
@keyframes kl-bubfloat { from { transform: translateY(0); } to { transform: translateY(-22px); } }
@keyframes kl-shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* feed the bear */
.kl-bear-stage { display: flex; justify-content: center; margin: 4px 0 6px; }
.kl-bear-stage .big { width: 190px; position: relative; }
.kl-foods { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
.kl-food { background: #fff; border: 4px solid #ffe08a; border-radius: 24px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 6px 0 #f0c453; font-size: 20px; font-weight: 900; color: #3b2a5e; }
.kl-food img { width: 64px; height: 64px; object-fit: contain; }
.kl-food .fw { font-size: 22px; }
.kl-food:active { transform: translateY(4px); box-shadow: 0 2px 0 #f0c453; }
.kl-food.nope { animation: kl-shake .4s ease; }

/* word train */
.kl-track { border-bottom: 6px solid #8a6a4b; border-radius: 4px; padding: 6px 4px 0; margin: 8px 0 16px; }
.kl-train { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: flex-end; }
.kl-car {
    min-width: 56px; height: 62px; border-radius: 16px; background: #fff;
    border: 3px dashed #b3a8e0; display: flex; align-items: center; justify-content: center; position: relative;
}
.kl-car img { width: 52px; height: 52px; }
.kl-car.full { border: 3px solid #7c5cff; background: #ede9ff; box-shadow: 0 4px 0 #b3a8e0; }
.kl-car:before { content: ''; position: absolute; bottom: -9px; left: 8px; width: 12px; height: 12px; border-radius: 50%; background: #4b3d78; box-shadow: 30px 0 0 #4b3d78; }
.kl-engine { width: 64px; margin-right: 2px; }
.kl-engine img { width: 100%; height: auto; display: block; }
.kl-tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.kl-tile { width: 60px; height: 60px; border: none; background: none; padding: 0; }
.kl-tile img { width: 100%; height: 100%; filter: drop-shadow(0 5px 0 rgba(120,70,20,.45)); }
.kl-tile:active { transform: translateY(3px); }
.kl-tile:disabled { opacity: .25; }
.kl-tile.nope { animation: kl-shake .4s ease; }

/* counting picnic */
.kl-items { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
.kl-item { width: 70px; height: 70px; border-radius: 50%; background: #fff; border: 3px solid #cdeecb; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #9ed69a; transition: transform .15s ease, opacity .15s ease; padding: 0; }
.kl-item img { width: 52px; height: 52px; object-fit: contain; }
.kl-item.took { transform: scale(0); opacity: 0; }
.kl-mouth { display: flex; justify-content: center; margin-top: 4px; }
.kl-mouth .mid { width: 150px; }
.kl-count-big { text-align: center; font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 rgba(0,80,140,.35); min-height: 52px; }

/* rocket math */
.kl-eq { text-align: center; background: #fff; border: 4px solid #bfe3ff; border-radius: 24px; font-size: 42px; font-weight: 900; color: #1d4ed8; padding: 12px; margin: 6px 0 14px; box-shadow: 0 6px 0 #8ec9f5; letter-spacing: 2px; }
.kl-rockets { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kl-rocket { border: none; border-radius: 22px; padding: 10px 8px; color: #fff; font-size: 26px; font-weight: 900; background: linear-gradient(135deg, #7c5cff, #4f3bd6); box-shadow: 0 6px 0 #3b2aa8; display: flex; align-items: center; justify-content: center; gap: 8px; }
.kl-rocket img { width: 44px; height: 34px; object-fit: contain; transform: rotate(-45deg); filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
.kl-rocket:active { transform: translateY(4px); box-shadow: 0 2px 0 #3b2aa8; }
.kl-rocket.launch { animation: kl-launch .7s ease-in forwards; }
.kl-rocket.nope { animation: kl-shake .4s ease; }
@keyframes kl-launch { 30% { transform: translateY(6px) scale(1.04); } 100% { transform: translateY(-420px) scale(.7); opacity: 0; } }

/* shape sorter */
.kl-holes { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 10px 0 18px; }
.kl-hole { width: 96px; height: 96px; border-radius: 22px; background: rgba(255,255,255,.55); border: 4px dashed rgba(70,50,120,.4); display: flex; align-items: center; justify-content: center; padding: 0; }
.kl-hole.armed { border-color: #ffd93d; border-style: solid; background: #fffbe8; transform: scale(1.05); }
.kl-hole.filled { border: 4px solid #7c5cff; background: #fff; box-shadow: 0 5px 0 #b3a8e0; }
.kl-shimg { width: 62px; height: 62px; object-fit: contain; }
.kl-pieces { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.kl-piece { width: 88px; height: 88px; border-radius: 22px; background: #fff; border: 4px solid #ffd93d; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #f0c453; position: relative; padding: 0; }
.kl-piece .kl-shimg { width: 58px; height: 58px; }
.kl-shface { position: absolute; width: 36px; height: auto; top: 30px; left: 50%; transform: translateX(-50%); pointer-events: none; }
.kl-piece.sel { transform: translateY(-8px) scale(1.08); border-color: #ff8a3d; box-shadow: 0 10px 0 #f0c453; }
.kl-piece.took { opacity: .2; transform: scale(.85); }
.kl-piece:active { transform: translateY(2px); }

/* ======= fx overlay ======= */
.kl-fx { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20, 40, 90, .62); opacity: 0; pointer-events: none; transition: opacity .22s ease; z-index: 50; }
.kl-fx-on { opacity: 1; pointer-events: none; }
.kl-fx-card { text-align: center; background: #fff; border-radius: 34px; padding: 24px 28px; border: 5px solid #ffd93d; box-shadow: 0 12px 0 rgba(0,0,0,.28); }
.kl-fx-art { width: 150px; margin: 0 auto; animation: kl-pop .55s ease; filter: drop-shadow(0 8px 16px rgba(0,0,0,.4)); }
.kl-fx-txt { color: #3b2a5e; font-size: 23px; font-weight: 900; margin-top: 10px; max-width: 300px; }
@keyframes kl-pop { 0% { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
.kl-conf { position: fixed; width: 12px; height: 12px; z-index: 60; animation: kl-confall 1.4s ease-out forwards; pointer-events: none; border-radius: 3px; }
@keyframes kl-confall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(65vh) rotate(540deg); opacity: 0; } }
.kl-starfly { position: fixed; width: 34px; height: 34px; z-index: 60; animation: kl-starrise 1.3s ease-out forwards; pointer-events: none; }
.kl-starfly img { width: 100%; height: 100%; }
@keyframes kl-starrise { 0% { transform: translateY(0) scale(.4); opacity: 0; } 30% { opacity: 1; transform: translateY(-40px) scale(1.2); } 100% { transform: translateY(-150px) scale(.9); opacity: 0; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

/* ================= storage ================= */
var KEY = 'kidslearn.v1';
function loadLS(k, fb) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
function saveLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var state = loadLS(KEY, null);

/* ================= themes: Kenney animal characters (CC0) ================= */
var THEMES = {
    bear: { ar: 'دب', en: 'Bear', charDef: 'Teddy', em: '🐻', img: 'assets/animals/bear.png', fx: 50, fy: 50, fr: 62,
        cheers: ['Great job, {n}! {c} is proud of you!', 'Beary good, {n}!', 'You did it, {n}!', '{c} says: WOW, {n}!', 'Your teacher Miss Lily is so happy, {n}!', 'Roar-some work, {n}!'],
        oops: ['Try again, {n}! You can do it!', 'Almost, {n}! One more try!'] },
    panda: { ar: 'باندا', en: 'Panda', charDef: 'Panda', em: '🐼', img: 'assets/animals/panda.png', fx: 50, fy: 48, fr: 64,
        cheers: ['Great job, {n}! {c} is proud of you!', 'Panda-tastic, {n}!', 'You did it, {n}!', '{c} says: WOW, {n}!', 'Your teacher Miss Lily is so happy, {n}!', 'Bamboo cheers for you, {n}!'],
        oops: ['Try again, {n}! You can do it!', 'Almost, {n}! One more try!'] },
    rabbit: { ar: 'أرنب', en: 'Rabbit', charDef: 'Bunny', em: '🐰', img: 'assets/animals/rabbit.png', fx: 50, fy: 38, fr: 56,
        cheers: ['Great job, {n}! {c} is proud of you!', 'Hip hop hooray, {n}!', 'You did it, {n}!', '{c} says: WOW, {n}!', 'Your teacher Miss Lily is so happy, {n}!', 'Some-bunny is smart, {n}!'],
        oops: ['Try again, {n}! Hop again!', 'Almost, {n}! One more hop!'] },
    dog: { ar: 'كلب', en: 'Dog', charDef: 'Puppy', em: '🐶', img: 'assets/animals/dog.png', fx: 50, fy: 46, fr: 60,
        cheers: ['Great job, {n}! {c} is proud of you!', 'Woof woof, well done, {n}!', 'You did it, {n}!', '{c} says: WOW, {n}!', 'Your teacher Miss Lily is so happy, {n}!', 'Top dog, {n}!'],
        oops: ['Try again, {n}! You can do it!', 'Almost, {n}! One more try!'] },
    duck: { ar: 'بطة', en: 'Duck', charDef: 'Ducky', em: '🦆', img: 'assets/animals/duck.png', fx: 50, fy: 50, fr: 62,
        cheers: ['Great job, {n}! {c} is proud of you!', 'Quack-tastic, {n}!', 'You did it, {n}!', '{c} says: WOW, {n}!', 'Your teacher Miss Lily is so happy, {n}!', 'Lucky ducky, {n}!'],
        oops: ['Try again, {n}! You can do it!', 'Almost, {n}! One more try!'] },
    monkey: { ar: 'قرد', en: 'Monkey', charDef: 'Monkey', em: '🐵', img: 'assets/animals/monkey.png', fx: 50, fy: 52, fr: 60,
        cheers: ['Great job, {n}! {c} is proud of you!', 'Bananas for you, {n}!', 'You did it, {n}!', '{c} says: WOW, {n}!', 'Your teacher Miss Lily is so happy, {n}!', 'Super monkey, {n}!'],
        oops: ['Try again, {n}! You can do it!', 'Almost, {n}! One more try!'] }
};
if (state && !THEMES[state.theme]) state.theme = 'bear';

/* ================= costume: animal + photo face (100% local) ================= */
var editTf = null, photoFrom = 'parents';
function photoStore() { return state || setupSel; }
function tfStyle(tf) { return 'transform:translate(' + tf.x + '%,' + tf.y + '%) scale(' + tf.s + ') rotate(' + tf.r + 'deg)'; }
function applyTf() { var im = document.getElementById('face-img'); if (im && editTf) im.style.cssText = tfStyle(editTf); }
function costumeHtml(tk, editor) {
    var t = THEMES[tk] || THEMES.bear;
    var store = photoStore();
    var tf = (editor && editTf) || store.faceTf || { x: 0, y: 0, s: 1, r: 0 };
    var h = '<div class="kl-costume">';
    h += '<img class="kl-animal" src="' + t.img + '" alt="' + esc(t.en) + '" draggable="false">';
    if (store.photo) {

var voiceOK = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);

var pickedVoice = null;
function voiceScore(v) {
    var s = 0;
    if (/enhanced|premium/i.test(v.name)) s += 100;
    var idx = -1;
    for (var i = 0; i < FEMALE_VOICES.length; i++) { if (v.name.indexOf(FEMALE_VOICES[i]) === 0) { idx = i; break; } }
    if (idx >= 0) s += 60 - idx;
    else if (/female/i.test(v.name)) s += 20;
    if (v.localService) s += 10;
    return s;
}
function pickVoice() {
    if (!voiceOK) return;
    var vs = speechSynthesis.getVoices();
    if (!vs || !vs.length) return;
    var best = null, bestS = -1;
    for (var i = 0; i < vs.length; i++) {
        var v = vs[i];
        if (v.lang.toLowerCase().indexOf('en') !== 0) continue;
        var sc = voiceScore(v);
        if (sc > bestS) { bestS = sc; best = v; }
    }
    pickedVoice = best;
}
if (voiceOK) {
    pickVoice();
    try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
}
function say(text) {
    if (!voiceOK || (state && state.muted)) return;
    try {
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.rate = 0.78; u.pitch = 1.28;
        if (pickedVoice) u.voice = pickedVoice;

    } catch (e) {}
}

/* ---------- game flow ---------- */
function startGame(id) {
    game = id;
    cur = GAMES[id].gen((state.levels && state.levels[id]) || 1, state.kg || 'kg1');
    screen = 'game';
    render();
    SFX.whoosh();
    if (cur.speak) say(cur.speak);
}

function levelUpMaybe(id, correct) {
    if (!state.levels) state.levels = {};
    if (!state.streaks) state.streaks = {};
    if (correct) {
        state.streaks[id] = (state.streaks[id] || 0) + 1;
        if (state.streaks[id] >= 3 && (state.levels[id] || 1) < 5) {
            state.levels[id] = (state.levels[id] || 1) + 1;
            state.streaks[id] = 0;
            SFX.fanfare();
            say('Level up! Level ' + state.levels[id] + '!');
        }
    } else {
        state.streaks[id] = 0;
    }
}

function fx(mood, text, speakText) {
    var el = document.getElementById('fx');
    if (!el) return;
    el.innerHTML = '<div class="kl-fx-card"><div class="kl-fx-art">' + heroArt() + '</div><div class="kl-fx-txt">' + esc(text) + '</div></div>';
    el.classList.add('kl-fx-on');
    if (speakText) say(speakText);
    for (var i = 0; i < 3; i++) {
        var st = document.createElement('div');
        st.className = 'kl-starfly';
        st.innerHTML = '<img src="assets/tiles/star.png" alt="">';
        st.style.left = (30 + rnd(40)) + '%';
        st.style.top = (45 + rnd(15)) + '%';
        st.style.animationDelay = (i * 0.12) + 's';
        document.body.appendChild(st);
        (function (n) { setTimeout(function () { n.remove(); }, 1400); })(st);
    }
    var confColors = ['#f472b6', '#38bdf8', '#4ade80', '#ffd93d', '#c084fc', '#fb923c'];
    for (var ci = 0; ci < 14; ci++) {
        var cf = document.createElement('div');
        cf.className = 'kl-conf';
        cf.style.left = (12 + rnd(76)) + '%';
        cf.style.top = (28 + rnd(18)) + '%';
        cf.style.background = confColors[rnd(confColors.length)];
        cf.style.animationDelay = (rnd(30) / 100) + 's';
        if (ci % 3 === 0) cf.style.borderRadius = '50%';
        document.body.appendChild(cf);
        (function (n) { setTimeout(function () { n.remove(); }, 1500); })(cf);
    }
    var starsP = document.querySelector('.kl-stars');
    if (starsP) { starsP.classList.remove('kl-stars-pop'); void starsP.offsetWidth; starsP.classList.add('kl-stars-pop'); }
}

function nextRound(delay) {
    fxLock = true;
    setTimeout(function () {
        var el = document.getElementById('fx');
        if (el) el.classList.remove('kl-fx-on');
        fxLock = false;
        if (screen === 'game') {
            cur = GAMES[game].gen((state.levels && state.levels[game]) || 1, state.kg || 'kg1');
            render();
            if (cur.speak) say(cur.speak);
        }
    }, delay);
}

function winRound(customSpeak) {
    state.stars = (state.stars || 0) + 1;
    levelUpMaybe(game, true);
    save();
    var line = cheer(theme().cheers);
    SFX.correct(); SFX.star();
    fx('yay', line, customSpeak || line);
    nextRound(1700);
}

function nope(el) {
    if (el) {
        el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope');
        setTimeout(function () { el.classList.remove('nope'); }, 450);
    }
    SFX.wrong();
    levelUpMaybe(game, false);
    save();
}

function flyTo(el, targetSel, done) {
    var t = document.querySelector(targetSel);
    if (!t || !el || !el.animate) { if (done) done(); return; }
    try {
        var r1 = el.getBoundingClientRect(), r2 = t.getBoundingClientRect();
        var dx = r2.left + r2.width / 2 - (r1.left + r1.width / 2);
        var dy = r2.top + r2.height / 2 - (r1.top + r1.height / 2);
        var an = el.animate([
            { transform: 'translate(0,0) scale(1)', opacity: 1 },
            { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.15)', opacity: .5 }
        ], { duration: 420, easing: 'ease-in' });
        an.onfinish = function () { if (done) done(); };
    } catch (e) { if (done) done(); }
}

/* ---------- mechanic handlers ---------- */
function bubbleTap(i, el) {
    if (fxLock || cur.bubbles[i].popped) return;
    if (cur.bubbles[i].ch === cur.target) {
        cur.bubbles[i].popped = true;
        cur.hits++;
        SFX.bubble();
        el.classList.add('hit');
        if (cur.hits >= cur.need) {
            fxLock = true;
            setTimeout(function () { fxLock = false; winRound(); }, 350);
        } else {
            say(NUMWORDS[cur.hits] + '!');
        }
    } else {
        nope(el);
    }
}

function feedTap(i, el) {
    if (fxLock) return;
    var o = cur.options[i];
    if (o.v === cur.answer) {
        fxLock = true;
        SFX.chomp();
        flyTo(el, '#bear-stage', function () {
            fxLock = false;
            winRound('Yummy! ' + cheer(theme().cheers));
        });
    } else {
        nope(el);
        say('No no, I want the ' + cur.word + '!');
    }
}

function trainTap(idx, el) {
    if (fxLock) return;
    var ch = cur.tiles[idx];
    var expect = cur.word[cur.placed.length];
    if (ch === expect) {
        cur.placed.push(ch);
        cur.usedIdx.push(idx);
        SFX.pop();
        if (cur.placed.length === cur.word.length) {
            SFX.horn();
            save();
            render();
            winRound(cur.word + '! ' + cheer(theme().cheers));
        } else {
            render();
        }
    } else {
        nope(el);
    }
}

function countTap(i, el) {
    if (fxLock || cur.items[i].took) return;
    if (cur.got >= cur.n) return;
    cur.items[i].took = true;
    cur.got++;
    SFX.pop();
    var numEl = document.getElementById('count-num');
    if (numEl) numEl.textContent = cur.got;
    say(NUMWORDS[cur.got] + '!');
    flyTo(el, '#feed-mouth', function () { el.classList.add('took'); });
    if (cur.got >= cur.n) {
        fxLock = true;
        setTimeout(function () { fxLock = false; winRound(); }, 650);
    }
}

function rocketTap(i, el) {
    if (fxLock) return;
    var v = cur.options[i];
    if (String(v) === String(cur.answer)) {
        fxLock = true;
        el.classList.add('launch');
        SFX.launch();
        setTimeout(function () { fxLock = false; winRound(); }, 600);
    } else {
        nope(el);
    }
}

function pieceTap(i) {
    if (fxLock || cur.pieces[i].took) return;
    cur.sel = (cur.sel === i) ? -1 : i;
    SFX.pop();
    render();
}

function holeTap(i, el) {
    if (fxLock) return;
    if (cur.sel < 0) { SFX.pop(); return; }
    var p = cur.pieces[cur.sel];
    if (p.key === cur.holes[i].key && !cur.holes[i].filled) {
        cur.holes[i].filled = true;
        p.took = true;
        cur.sel = -1;
        SFX.snap();
        if (cur.holes.every(function (h) { return h.filled; })) {
            render();
            winRound();
        } else {
            render();
            say(pick(['Yes!', 'Nice!', 'Perfect!']));
        }
    } else {
        nope(el);
    }
}

/* ---------- wiring ---------- */
function wire() {
    document.querySelectorAll('[data-theme]').forEach(function (b) {
        b.addEventListener('click', function () {
            var nEl = document.getElementById('su-name'), cEl = document.getElementById('su-char');
            if (nEl) setupSel.name = nEl.value;
            if (cEl) setupSel.char = cEl.value;
            setupSel.theme = b.getAttribute('data-theme'); render();
        });
    });
    document.querySelectorAll('[data-ptheme]').forEach(function (b) {
        b.addEventListener('click', function () { state.theme = b.getAttribute('data-ptheme'); save(); render(); });
    });
    document.querySelectorAll('[data-kg]').forEach(function (b) {
        b.addEventListener('click', function () {
            var nEl = document.getElementById('su-name'), cEl = document.getElementById('su-char');
            if (nEl) setupSel.name = nEl.value;
            if (cEl) setupSel.char = cEl.value;
            setupSel.kg = b.getAttribute('data-kg'); render();
        });
    });
    document.querySelectorAll('[data-pkg]').forEach(function (b) {
        b.addEventListener('click', function () { state.kg = b.getAttribute('data-pkg'); save(); SFX.pop(); render(); });
    });
    document.querySelectorAll('[data-game]').forEach(function (b) {
        b.addEventListener('click', function () { startGame(b.getAttribute('data-game')); });
    });
    document.querySelectorAll('[data-bub]').forEach(function (b) {
        b.addEventListener('click', function () { bubbleTap(Number(b.getAttribute('data-bub')), b); });
    });
    document.querySelectorAll('[data-food]').forEach(function (b) {
        b.addEventListener('click', function () { feedTap(Number(b.getAttribute('data-food')), b); });
    });
    document.querySelectorAll('[data-tile]').forEach(function (b) {
        b.addEventListener('click', function () { trainTap(Number(b.getAttribute('data-tile')), b); });
    });
    document.querySelectorAll('[data-item]').forEach(function (b) {
        b.addEventListener('click', function () { countTap(Number(b.getAttribute('data-item')), b); });
    });
    document.querySelectorAll('[data-rocket]').forEach(function (b) {
        b.addEventListener('click', function () { rocketTap(Number(b.getAttribute('data-rocket')), b); });
    });
    document.querySelectorAll('[data-piece]').forEach(function (b) {
        b.addEventListener('click', function () { pieceTap(Number(b.getAttribute('data-piece'))); });
    });
    document.querySelectorAll('[data-hole]').forEach(function (b) {
        b.addEventListener('click', function () { holeTap(Number(b.getAttribute('data-hole')), b); });
    });
    document.querySelectorAll('[data-act]').forEach(function (b) {
        b.addEventListener('click', function () {
            var act = b.getAttribute('data-act');
            if (act === 'start') {
                var nm = (document.getElementById('su-name').value || '').trim();
                var ch = (document.getElementById('su-char').value || '').trim();
                if (!nm) { say('Please write the kid name first'); return; }
                state = { name: nm, charName: ch || THEMES[setupSel.theme].charDef, theme: setupSel.theme, kg: setupSel.kg, stars: 0, levels: {}, streaks: {}, photo: setupSel.photo || null, faceTf: setupSel.faceTf || null };
                save();
                screen = 'home';
                render();
                SFX.fanfare();
                say('Hi ' + nm + '! Let us play and learn!');
            } else if (act === 'home') { SFX.whoosh(); screen = 'home'; render(); }
            else if (act === 'mute') {
                state.muted = !state.muted; save();
                if (state.muted && voiceOK) { try { speechSynthesis.cancel(); } catch (e) {} }
                if (!state.muted) SFX.pop();
                render();
            }
            else if (act === 'photo-open') {
                photoFrom = screen;
                editTf = Object.assign({ x: 0, y: 0, s: 1, r: 0 }, photoStore().faceTf || {});
                SFX.whoosh(); screen = 'photo'; render();
            }
            else if (act === 'photo-done') {
                photoStore().faceTf = editTf;
                if (state) save();
                SFX.whoosh(); screen = photoFrom; render();
            }
            else if (act === 'photo-choose') { var fi2 = document.getElementById('face-file'); if (fi2) fi2.click(); }
            else if (act === 'photo-clear') {
                var st2 = photoStore();
                st2.photo = null; st2.faceTf = { x: 0, y: 0, s: 1, r: 0 };
                editTf = null;
                if (state) save();
                render();
            }
            else if (act === 'pasave') {
                state.name = (document.getElementById('pa-name').value || '').trim() || state.name;
                state.charName = (document.getElementById('pa-char').value || '').trim() || theme().charDef;
                save(); parentMsg = 'اتحفظ ✅'; render();
                setTimeout(function () { parentMsg = ''; if (screen === 'parents') render(); }, 2000);
            }
            else if (act === 'backup') {
                var txt = JSON.stringify(state);
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(function () { parentMsg = 'اتنسخ ✅ احتفظوا بيها في ملاحظة'; render(); });
                } else { parentMsg = txt; render(); }
            }
            else if (act === 'reset') {
                if (b.dataset.armed) { state.stars = 0; state.levels = {}; state.streaks = {}; save(); parentMsg = 'اتمسح 🗑️'; render(); }
                else { b.dataset.armed = '1'; b.textContent = 'متأكدين؟ دوسوا تاني للمسح'; }
            }
            else if (act === 'newkid') {
                if (b.dataset.armed) {
                    try { localStorage.removeItem(KEY); } catch (e) {}
                    state = null;
                    setupSel = { theme: 'bear', name: '', char: '', kg: 'kg1' };
                    screen = 'setup';
                    render();
                } else { b.dataset.armed = '1'; b.textContent = 'متأكدين؟ ده هيمسح كل حاجة - دوسوا تاني'; }
            }
        });
    });
    /* parents gate: hold the gear 1.2s, or triple-tap it */
    var pb = document.getElementById('parents-btn');
    if (pb) {
        pb.replaceWith(pb.cloneNode(true));
        var pb2 = document.getElementById('parents-btn');
        var openParents = function () {
            if (state) { state.parentsSeen = true; save(); }
            screen = 'parents'; render();
        };
        var startHold = function (e) {
            if (parentHold) clearTimeout(parentHold);
            parentHold = setTimeout(function () { parentHold = null; parentTaps = 0; openParents(); }, 1200);
        };
        var endHold = function () {
            if (parentHold) {
                clearTimeout(parentHold); parentHold = null;
                parentTaps++;
                if (parentTaps >= 3) { parentTaps = 0; openParents(); }
                else setTimeout(function () { parentTaps = 0; }, 800);
            }
        };
        var cancelHold = function () { if (parentHold) { clearTimeout(parentHold); parentHold = null; } };
        pb2.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        pb2.addEventListener('touchstart', startHold, { passive: true });
        pb2.addEventListener('touchend', endHold);
        pb2.addEventListener('touchcancel', cancelHold);
        pb2.addEventListener('mousedown', startHold);
        pb2.addEventListener('mouseup', endHold);
        pb2.addEventListener('mouseleave', cancelHold);
    }

    /* photo upload (100% local) */
    var fi = document.getElementById('face-file');
    if (fi) {
        fi.addEventListener('change', function () {
            var f = fi.files && fi.files[0];
            if (!f) return;
            var rd = new FileReader();
            rd.onload = function () {
                var img = new Image();
                img.onload = function () {
                    var m = Math.min(1, 320 / Math.max(img.width || 1, img.height || 1));
                    var cv = document.createElement('canvas');
                    cv.width = Math.max(1, Math.round(img.width * m));
                    cv.height = Math.max(1, Math.round(img.height * m));
                    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
                    var store = photoStore();
                    store.photo = cv.toDataURL('image/jpeg', 0.85);
                    editTf = { x: 0, y: 0, s: 1, r: 0 };
                    store.faceTf = editTf;
                    if (state) save();
                    render();
                };
                img.src = rd.result;
            };
            rd.readAsDataURL(f);
        });
    }

    /* face stage: drag to move, pinch to zoom + rotate */
    var stg = document.getElementById('face-stage');
    if (stg) {
        var pts = {}, last1 = null, g0 = null;
        var pair = function () {
            var ks = Object.keys(pts), a = pts[ks[0]], b = pts[ks[1]];
            var dx = b.x - a.x, dy = b.y - a.y;
            return { d: Math.sqrt(dx * dx + dy * dy), a: Math.atan2(dy, dx) * 180 / Math.PI };
        };
        var syncSliders = function () {
            var s = document.getElementById('fc-s'), r = document.getElementById('fc-r');
            if (s) s.value = editTf.s;
            if (r) r.value = editTf.r;
        };
        stg.addEventListener('pointerdown', function (e) {
            try { stg.setPointerCapture(e.pointerId); } catch (er) {}
            pts[e.pointerId] = { x: e.clientX, y: e.clientY };
            if (Object.keys(pts).length === 1) last1 = { x: e.clientX, y: e.clientY };
            if (Object.keys(pts).length === 2) { var m = pair(); g0 = { d: m.d, a: m.a, s: editTf.s, r: editTf.r }; }
        });
        stg.addEventListener('pointermove', function (e) {
            if (!pts[e.pointerId] || !editTf) return;
            pts[e.pointerId] = { x: e.clientX, y: e.clientY };
            var n = Object.keys(pts).length;
            var k = 100 / Math.max(1, stg.clientWidth);
            if (n === 1 && last1) {
                editTf.x += (e.clientX - last1.x) * k;
                editTf.y += (e.clientY - last1.y) * k;
                last1 = { x: e.clientX, y: e.clientY };
            } else if (n === 2 && g0) {
                var m = pair();
                if (g0.d > 0) editTf.s = Math.min(3, Math.max(0.4, g0.s * m.d / g0.d));
                editTf.r = Math.min(180, Math.max(-180, g0.r + (m.a - g0.a)));
            }
            applyTf(); syncSliders();
        });
        var upFn = function (e) {
            delete pts[e.pointerId];
            var ks = Object.keys(pts);
            if (ks.length === 1) { last1 = { x: pts[ks[0]].x, y: pts[ks[0]].y }; g0 = null; }
        };
        stg.addEventListener('pointerup', upFn);
        stg.addEventListener('pointercancel', upFn);
        var sS = document.getElementById('fc-s'), sR = document.getElementById('fc-r');
        if (sS) sS.addEventListener('input', function () { editTf.s = Number(sS.value); applyTf(); });
        if (sR) sR.addEventListener('input', function () { editTf.r = Number(sR.value); applyTf(); });
    }
}

render();

/* ================= service worker ================= */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
    });
}
</script>
