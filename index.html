<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2ea8f0">
<title>Kids Learn — العب وتعلم</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; background: #6ecdf5; overflow: hidden; }
body { font-family: "Baloo Bhaijaan 2", "Baloo 2", ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; margin: 0 auto; }
#dom { position: fixed; inset: 0; overflow-y: auto; z-index: 10; display: none; -webkit-overflow-scrolling: touch; }
#boot {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(180deg, #2ea8f0, #6ecdf5 55%, #8ed06e);
}
#boot img { width: 120px; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-10px); } }
#boot .bar { width: 200px; height: 16px; border-radius: 999px; background: rgba(255,255,255,.4); overflow: hidden; border: 3px solid #fff; }
#boot .bar i { display: block; height: 100%; width: 0%; background: #ffd93d; border-radius: 999px; transition: width .2s; }
#boot .t { color: #fff; font-weight: 900; font-size: 18px; text-shadow: 0 2px 0 rgba(0,80,140,.35); }
</style>
</head>
<body>
<div id="game"></div>
<div id="dom"></div>
<div id="boot">
    <img src="assets/animals/bear.png" alt="">
    <div class="bar"><i id="boot-fill"></i></div>
    <div class="t" id="boot-txt">Loading…</div>
</div>
<script src="lib/phaser.min.js"></script>
<script src="js/data.js"></script>
<script src="js/vo-manifest.js"></script>
<script src="js/sfx.js"></script>
<script src="js/vo.js"></script>
<script src="js/dom-screens.js"></script>
<script src="js/scenes.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
